[package]
build = "build.rs"
categories = ["command-line-utilities", "development-tools"]
description = "A plugin-driven installer for development tools: a tool ships as a plain TOML manifest declaring how to get it, where to install it, and what environment variables to set."
edition = "2024"
homepage = "https://github.com/YWZYXSoCool/wanted"
keywords = ["installer", "dev-tools", "tui", "plugin"]
license = "MIT OR Apache-2.0"
name = "wanted"
readme = "README.md"
repository = "https://github.com/YWZYXSoCool/wanted.git"
version = "0.1.0"

exclude = ["registry/**"]

[dependencies]
clap = {version = "4.6", features = ["derive"]}
ctrlc = "3"
flate2 = "1"
indicatif = "0.18"
schemars = {version = "1", default-features = false, features = ["derive"]}
semver = "1"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
toml = "0.8"
ureq = "2"
xz2 = "0.1"
zip = {version = "2", default-features = false, features = ["deflate"]}

[target.'cfg(windows)'.dependencies]
winreg = {version = "0.55", features = ["serialization-serde"]}

# build.rs regenerates schema/plugin.schema.json from src/plugin/raw.rs, which
# needs the same derive crates the library uses.
[build-dependencies]
schemars = {version = "1", default-features = false, features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"

[dev-dependencies]
tempfile = "3"
