[package]
edition = "2024"
name = "wanted"
version = "0.1.0"
build = "build.rs"

[dependencies]
clap = {version = "4.6", features = ["derive"]}
flate2 = "1"
schemars = {version = "1", default-features = false, features = ["derive"]}
semver = "1"
serde = {version = "1", features = ["derive"]}
tar = "0.4"
thiserror = "2"
toml = "0.8"
ureq = "2"
ctrlc = "3"
indicatif = "0.18"
xz2 = "0.1"
zip = {version = "2", default-features = false, features = ["deflate"]}

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", features = ["serialization-serde"] }

# build.rs regenerates schema/plugin.schema.json from src/plugin/raw.rs, which
# needs the same derive crates the library uses.
[build-dependencies]
schemars = {version = "1", default-features = false, features = ["derive"]}
serde = {version = "1", features = ["derive"]}
serde_json = "1"

[dev-dependencies]
tempfile = "3"