[package]
edition = "2024"
name = "wanted"
version = "0.1.0"

[dependencies]
clap = {version = "4.6", features = ["derive"]}
flate2 = "1"
serde = {version = "1", features = ["derive"]}
tar = "0.4"
thiserror = "2"
toml = "0.8"
ureq = "2"
indicatif = "0.18"
zip = {version = "2", default-features = false, features = ["deflate"]}

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", features = ["serialization-serde"] }

[dev-dependencies]
tempfile = "3"
